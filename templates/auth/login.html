{% extends "base.html" %}
{% block title %}Login • Controle de Licenças{% endblock %}
{% block content %}
<div class="max-w-md mx-auto">
  <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow">
    <h1 class="text-xl font-semibold">Entrar</h1>
    <p class="text-sm text-slate-400 mt-1">Acesso restrito ao administrador.</p>

    <form method="post" class="mt-6 space-y-4">
      {% csrf_token %}
      <div>
        <label class="text-sm text-slate-300">Usuário</label>
        <input name="username" autofocus required
               class="mt-1 w-full px-3 py-2 rounded-xl bg-slate-950 border border-slate-800 focus:outline-none focus:ring-2 focus:ring-slate-600" />
      </div>
      <div>
        <label class="text-sm text-slate-300">Senha</label>
        <input type="password" name="password" required
               class="mt-1 w-full px-3 py-2 rounded-xl bg-slate-950 border border-slate-800 focus:outline-none focus:ring-2 focus:ring-slate-600" />
      </div>

      {% if form.errors %}
        <div class="text-sm text-red-300 bg-red-950/40 border border-red-900 rounded-xl p-3">
          Usuário ou senha inválidos.
        </div>
      {% endif %}

      <button class="w-full py-2.5 rounded-xl bg-slate-200 text-slate-900 font-semibold hover:bg-white">
        Entrar
      </button>
    </form>
  </div>
</div>
{% endblock %}
